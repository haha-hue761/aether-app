name: Aether P2P Cloud APK Builder

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Zero-Knowledge P2P APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap Android Gradle Wrapper
        run: |
          mkdir -p /tmp/aether_backup
          cp pubspec.yaml /tmp/aether_backup/
          cp -r lib /tmp/aether_backup/
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/aether_backup/
          fi

          flutter create --project-name aether_p2p --org org.aether.p2p --platforms android .

          cp /tmp/aether_backup/pubspec.yaml ./pubspec.yaml
          rm -rf ./lib && cp -r /tmp/aether_backup/lib ./lib
          if [ -f /tmp/aether_backup/AndroidManifest.xml ]; then
            cp /tmp/aether_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Sanitize AndroidManifest & Set minSdk 24
        run: |
          # Удаляем устаревший атрибут package="org.aether.p2p" из AndroidManifest.xml (требование AGP 8+)
          sed -i 's/package="[^"]*"//g' android/app/src/main/AndroidManifest.xml

          # Выставляем minSdk 24 в build.gradle / build.gradle.kts
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Auto-Fix Plugin Gradle Compatibility in Pub Cache
        run: |
          # На случай если плагин ищет android.flutter.compileSdkVersion или старый Registrar
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/android.flutter.compileSdkVersion/34/g' {} + || true
          find ~/.pub-cache -name "FlutterWebRTCPlugin.java" -exec sed -i '/PluginRegistry\.Registrar/d' {} + || true
          find ~/.pub-cache -name "FlutterWebRTCPlugin.java" -exec sed -i '/registerWith(Registrar/,/^[[:space:]]*}/d' {} + || true

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload Compiled APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aether-P2P-Release-APKs
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
