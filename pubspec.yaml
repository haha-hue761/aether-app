publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  bip39: ^1.0.6
  flutter_webrtc: ^0.12.7
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  convert: ^3.1.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
